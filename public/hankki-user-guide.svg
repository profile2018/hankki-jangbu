<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1440" viewBox="0 0 1200 1440" role="img" aria-labelledby="title desc"><title id="title">한끼장부 초보자 사용설명서</title><desc id="desc">관리자 5단계, 키오스크 4단계 사용 안내</desc><rect width="1200" height="1440" fill="#fff8eb"/><rect x="30" y="26" width="1140" height="154" rx="30" fill="#fff"/><circle cx="112" cy="103" r="52" fill="#c94f2d"/><text x="112" y="117" text-anchor="middle" font-size="33" font-weight="bold" fill="#fff" font-family="sans-serif">한끼</text><text x="190" y="96" font-size="52" font-weight="bold" fill="#49372b" font-family="sans-serif">한끼장부 사용설명서</text><text x="193" y="138" font-size="25" fill="#766354" font-family="sans-serif">식수 기록부터 월별 정산까지, 처음 사용하시는 분들을 위한 안내</text><rect x="30" y="205" width="1140" height="62" rx="18" fill="#c94f2d"/><text x="60" y="248" font-size="30" font-weight="bold" fill="#fff" font-family="sans-serif">관리자 화면  |  PC · 스마트폰</text><rect x="32" y="284" width="1136" height="108" rx="20" fill="#fff" stroke="#f0dfc9" stroke-width="2"/><circle cx="100" cy="338" r="35" fill="#e88436"/><text x="100" y="349" font-size="31" text-anchor="middle" font-weight="bold" fill="#fff" font-family="sans-serif">1</text><text x="165" y="327" font-size="31" font-weight="bold" fill="#49372b" font-family="sans-serif">로그인 / 무료체험</text><text x="165" y="364" font-size="24" fill="#766354" font-family="sans-serif">홈 화면에서 로그인 또는 무료체험 시작하기를 누르세요.</text><rect x="32" y="407" width="1136" height="108" rx="20" fill="#fff" stroke="#f0dfc9" stroke-width="2"/><circle cx="100" cy="461" r="35" fill="#e88436"/><text x="100" y="472" font-size="31" text-anchor="middle" font-weight="bold" fill="#fff" font-family="sans-serif">2</text><text x="165" y="450" font-size="31" font-weight="bold" fill="#49372b" font-family="sans-serif">거래처 등록</text><text x="165" y="487" font-size="24" fill="#766354" font-family="sans-serif">식사하는 업체명, 식대, 업체번호(PIN)를 등록하세요.</text><rect x="32" y="530" width="1136" height="108" rx="20" fill="#fff" stroke="#f0dfc9" stroke-width="2"/><circle cx="100" cy="584" r="35" fill="#e88436"/><text x="100" y="595" font-size="31" text-anchor="middle" font-weight="bold" fill="#fff" font-family="sans-serif">3</text><text x="165" y="573" font-size="31" font-weight="bold" fill="#49372b" font-family="sans-serif">오늘 식수 확인</text><text x="165" y="610" font-size="24" fill="#766354" font-family="sans-serif">대시보드에서 중식·석식 인원을 확인하세요.</text><rect x="32" y="653" width="1136" height="108" rx="20" fill="#fff" stroke="#f0dfc9" stroke-width="2"/><circle cx="100" cy="707" r="35" fill="#e88436"/><text x="100" y="718" font-size="31" text-anchor="middle" font-weight="bold" fill="#fff" font-family="sans-serif">4</text><text x="165" y="696" font-size="31" font-weight="bold" fill="#49372b" font-family="sans-serif">월별 정산</text><text x="165" y="733" font-size="24" fill="#766354" font-family="sans-serif">월별 정산 메뉴에서 업체별 식수와 금액을 확인하세요.</text><rect x="32" y="776" width="1136" height="108" rx="20" fill="#fff" stroke="#f0dfc9" stroke-width="2"/><circle cx="100" cy="830" r="35" fill="#e88436"/><text x="100" y="841" font-size="31" text-anchor="middle" font-weight="bold" fill="#fff" font-family="sans-serif">5</text><text x="165" y="819" font-size="31" font-weight="bold" fill="#49372b" font-family="sans-serif">정산서 발송</text><text x="165" y="856" font-size="24" fill="#766354" font-family="sans-serif">정산서 PDF를 저장·인쇄하거나 이메일로 보내세요.</text><rect x="30" y="922" width="1140" height="62" rx="18" fill="#56805a"/><text x="60" y="964" font-size="30" font-weight="bold" fill="#fff" font-family="sans-serif">키오스크 화면  |  현장 식수 입력</text><rect x="32" y="1000" width="1136" height="78" rx="18" fill="#fff" stroke="#dfe9d8" stroke-width="2"/><circle cx="92" cy="1039" r="28" fill="#56805a"/><text x="92" y="1048" font-size="25" text-anchor="middle" font-weight="bold" fill="#fff" font-family="sans-serif">1</text><text x="145" y="1032" font-size="27" font-weight="bold" fill="#49372b" font-family="sans-serif">업체번호 입력</text><text x="145" y="1061" font-size="21" fill="#766354" font-family="sans-serif">식당에서 안내받은 4자리 업체번호를 누르고 확인하세요.</text><rect x="32" y="1091" width="1136" height="78" rx="18" fill="#fff" stroke="#dfe9d8" stroke-width="2"/><circle cx="92" cy="1130" r="28" fill="#56805a"/><text x="92" y="1139" font-size="25" text-anchor="middle" font-weight="bold" fill="#fff" font-family="sans-serif">2</text><text x="145" y="1123" font-size="27" font-weight="bold" fill="#49372b" font-family="sans-serif">중식 · 석식 선택</text><text x="145" y="1152" font-size="21" fill="#766354" font-family="sans-serif">오늘 식사하는 구분을 선택하세요.</text><rect x="32" y="1182" width="1136" height="78" rx="18" fill="#fff" stroke="#dfe9d8" stroke-width="2"/><circle cx="92" cy="1221" r="28" fill="#56805a"/><text x="92" y="1230" font-size="25" text-anchor="middle" font-weight="bold" fill="#fff" font-family="sans-serif">3</text><text x="145" y="1214" font-size="27" font-weight="bold" fill="#49372b" font-family="sans-serif">인원수 입력</text><text x="145" y="1243" font-size="21" fill="#766354" font-family="sans-serif">실제로 식사하는 인원을 입력하세요.</text><rect x="32" y="1273" width="1136" height="78" rx="18" fill="#fff" stroke="#dfe9d8" stroke-width="2"/><circle cx="92" cy="1312" r="28" fill="#56805a"/><text x="92" y="1321" font-size="25" text-anchor="middle" font-weight="bold" fill="#fff" font-family="sans-serif">4</text><text x="145" y="1305" font-size="27" font-weight="bold" fill="#49372b" font-family="sans-serif">등록 완료</text><text x="145" y="1334" font-size="21" fill="#766354" font-family="sans-serif">등록하기를 누른 후 완료 메시지를 확인하세요.</text><text x="600" y="1404" text-anchor="middle" font-size="26" font-weight="bold" fill="#c94f2d" font-family="sans-serif">www.hankkijangbu.kr</text></svg>