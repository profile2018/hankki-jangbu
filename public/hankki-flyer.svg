<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536">
  <defs>
    <style>
      .t{font-family:Arial,'Noto Sans KR',sans-serif;fill:#172033}.b{font-weight:800}.navy{fill:#173b6d}.blue{fill:#175cd3}.orange{fill:#e76f00}.green{fill:#118a55}.purple{fill:#7450b8}.muted{fill:#667085}.white{fill:#fff}.small{font-size:22px}.mid{font-size:28px}.lg{font-size:42px}.xl{font-size:62px}.xxl{font-size:78px}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1024" height="1536" fill="#fbfaf6"/>

  <rect x="28" y="24" width="125" height="125" rx="28" class="navy"/>
  <text x="90" y="76" text-anchor="middle" class="white b lg">한끼</text>
  <text x="90" y="124" text-anchor="middle" class="white b lg">장부</text>
  <text x="180" y="58" class="t b mid">공단 한식뷔페 식수 · 정산 관리 서비스</text>
  <text x="180" y="123" class="navy b xxl">식수 관리부터</text>
  <text x="180" y="198" class="orange b xxl">월말 정산까지</text>
  <text x="180" y="275" class="t b xxl">한번에!</text>
  <text x="180" y="316" class="t mid">수기 장부는 이제 그만!</text>
  <text x="180" y="352" class="navy b mid">한끼장부로 쉽고 정확하게 관리하세요.</text>

  <g transform="translate(650,32)" filter="url(#shadow)">
    <rect x="0" y="0" width="330" height="300" rx="30" fill="#1d2430"/>
    <rect x="20" y="20" width="290" height="250" rx="18" fill="#fff"/>
    <text x="165" y="65" text-anchor="middle" class="t b mid">중식</text>
    <text x="165" y="112" text-anchor="middle" class="blue b lg">12명</text>
    <rect x="58" y="140" width="72" height="60" rx="12" class="navy"/><text x="94" y="181" text-anchor="middle" class="white b lg">−</text>
    <rect x="198" y="140" width="72" height="60" rx="12" class="navy"/><text x="234" y="181" text-anchor="middle" class="white b lg">+</text>
    <rect x="45" y="215" width="240" height="45" rx="10" class="navy"/><text x="165" y="246" text-anchor="middle" class="white b small">입력 완료</text>
  </g>
  <circle cx="930" cy="292" r="76" fill="#ffd84d"/><text x="930" y="276" text-anchor="middle" class="navy b small">터치 한 번으로</text><text x="930" y="311" text-anchor="middle" class="t b mid">식수 입력 끝!</text>

  <g transform="translate(28,390)">
    <rect width="968" height="150" rx="20" fill="#fff" stroke="#f0c88e"/>
    <g transform="translate(28,24)"><rect width="215" height="100" rx="16" fill="#f5fbf7"/><text x="20" y="34" class="green b mid">간단한 입력</text><text x="20" y="68" class="t small">중식·석식·인원수를</text><text x="20" y="96" class="t small">키오스크에서 간단히</text></g>
    <g transform="translate(260,24)"><rect width="215" height="100" rx="16" fill="#f5f9ff"/><text x="20" y="34" class="blue b mid">실시간 집계</text><text x="20" y="68" class="t small">오늘 식수와 업체별</text><text x="20" y="96" class="t small">이용 현황을 바로 확인</text></g>
    <g transform="translate(492,24)"><rect width="215" height="100" rx="16" fill="#fff8f0"/><text x="20" y="34" class="orange b mid">월말 자동 정산</text><text x="20" y="68" class="t small">복잡한 계산 없이</text><text x="20" y="96" class="t small">정산서·청구서 작성</text></g>
    <g transform="translate(724,24)"><rect width="215" height="100" rx="16" fill="#faf7ff"/><text x="20" y="34" class="purple b mid">이메일 발송</text><text x="20" y="68" class="t small">정산서를 업체에</text><text x="20" y="96" class="t small">이메일로 간편 발송</text></g>
