      <g transform="translate(0,64)"><circle cx="30" cy="28" r="24" class="navy"/><text x="30" y="36" text-anchor="middle" class="white b small">2</text><text x="68" y="25" class="t b mid">식수 입력</text><text x="68" y="54" class="muted small">업체번호 → 중식·석식 → 인원</text></g>
      <g transform="translate(0,128)"><circle cx="30" cy="28" r="24" class="navy"/><text x="30" y="36" text-anchor="middle" class="white b small">3</text><text x="68" y="25" class="t b mid">자동 집계</text><text x="68" y="54" class="muted small">오늘 식수와 업체별 현황 확인</text></g>
      <g transform="translate(0,192)"><circle cx="30" cy="28" r="24" class="navy"/><text x="30" y="36" text-anchor="middle" class="white b small">4</text><text x="68" y="25" class="t b mid">월말 정산</text><text x="68" y="54" class="muted small">업체별 청구금액 자동 계산</text></g>
      <g transform="translate(0,256)"><circle cx="30" cy="28" r="24" class="navy"/><text x="30" y="36" text-anchor="middle" class="white b small">5</text><text x="68" y="25" class="t b mid">청구서 발송</text><text x="68" y="54" class="muted small">정산서·청구서를 이메일로 발송</text></g>
    </g>
  </g>

  <g transform="translate(635,565)">
    <rect width="361" height="375" rx="22" fill="#fff" stroke="#dfe5ee"/>
    <rect width="361" height="54" rx="22" class="navy"/><rect y="32" width="361" height="22" class="navy"/>
    <text x="180" y="38" text-anchor="middle" class="white b mid">요금제</text>
    <rect x="24" y="78" width="313" height="76" rx="14" fill="#f4fff8" stroke="#4bb777"/>
    <text x="180" y="111" text-anchor="middle" class="green b mid">30일 무료체험</text><text x="180" y="139" text-anchor="middle" class="t small">모든 기능을 먼저 사용해 보세요!</text>
    <rect x="24" y="170" width="313" height="76" rx="14" fill="#f6f9ff" stroke="#5f94e8"/>
    <text x="48" y="203" class="blue b mid">Basic</text><text x="313" y="207" text-anchor="end" class="blue b lg">29,000원</text><text x="48" y="234" class="t small">월 이용료</text>
    <rect x="24" y="262" width="313" height="76" rx="14" fill="#fff8f0" stroke="#f0a45c"/>
    <text x="48" y="295" class="orange b mid">Plus</text><text x="313" y="299" text-anchor="end" class="orange b lg">49,000원</text><text x="48" y="326" class="t small">확장 기능 제공</text>
    <text x="180" y="360" text-anchor="middle" class="muted small">※ 요금제는 부가세 별도입니다.</text>
  </g>

  <g transform="translate(28,965)">
    <rect width="585" height="300" rx="22" fill="#fff" stroke="#dfe5ee"/>
    <rect width="585" height="54" rx="22" class="green"/><rect y="32" width="585" height="22" class="green"/>
    <text x="292" y="38" text-anchor="middle" class="white b mid">한끼장부의 장점</text>
    <g class="t small">
      <text x="38" y="98">✓  수기 장부 불필요</text><text x="300" y="98" class="muted">종이 장부 없이 깔끔하게</text>
      <text x="38" y="142">✓  누락·오류 최소화</text><text x="300" y="142" class="muted">자동 집계로 실수 감소</text>
      <text x="38" y="186">✓  실시간 확인</text><text x="300" y="186" class="muted">오늘 식수·업체별 현황</text>
      <text x="38" y="230">✓  월말 정산 자동화</text><text x="300" y="230" class="muted">복잡한 계산 없이 정산</text>
      <text x="38" y="274">✓  간편한 청구·발송</text><text x="300" y="274" class="muted">이메일로 바로 발송</text>
    </g>
  </g>

  <g transform="translate(635,965)">
    <rect width="361" height="300" rx="22" fill="#fff4bd" stroke="#efd56c"/>
    <text x="24" y="50" class="t b mid">키오스크용 태블릿은</text>
    <text x="24" y="88" class="t b mid">별도 구매입니다.</text>
    <text x="24" y="138" class="t small">기존에 사용 중인 태블릿이 있다면</text>
    <text x="24" y="174" class="t b small">별도 구매 없이 사용 가능합니다!</text>
    <text x="24" y="225" class="t small">사용 가능 여부가 궁금하시면</text>
    <text x="24" y="261" class="t small">기기 확인을 도와드립니다.</text>
  </g>

  <g transform="translate(28,1290)">
    <rect width="968" height="166" rx="22" fill="#fff" stroke="#dfe5ee"/>
    <text x="32" y="45" class="navy b mid">이런 분들께 추천합니다!</text>
    <text x="32" y="83" class="t small">✓ 공단·산업단지 한식뷔페 사장님   ✓ 식수 관리와 정산이 번거로우신 분</text>
    <text x="32" y="119" class="t small">✓ 정확하고 간편한 관리를 원하시는 분   ✓ 종이 장부에서 벗어나고 싶은 분</text>
    <line x1="610" y1="28" x2="610" y2="140" stroke="#dfe5ee"/>
    <text x="640" y="58" class="t b mid">문의 / 상담</text>
    <text x="640" y="98" class="navy b lg">010-4696-5037</text>
    <text x="640" y="132" class="t b mid">카카오톡  bwk2000</text>
  </g>

  <rect y="1480" width="1024" height="56" class="navy"/>
  <text x="42" y="1517" class="white b mid">웹사이트  hankkijangbu.kr</text>
  <text x="985" y="1517" text-anchor="end" class="white small">한끼장부 · 공단 한식뷔페 식수·정산 관리 서비스</text>
</svg>